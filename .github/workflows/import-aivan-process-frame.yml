name: Import authentic AIVAN design-process frame

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-aivan-process-frame.yml"
      - "tools/import_aivan_process_frame.py"

permissions:
  contents: write

concurrency:
  group: aivan-process-frame
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout AIVAN
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install frame dependencies
        run: python -m pip install "Pillow==11.3.0" "gdown==5.2.0" "imageio-ffmpeg==0.6.0"
      - name: Extract verified original frame
        run: python tools/import_aivan_process_frame.py
      - name: Commit authentic frame
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/brand-sketch-process.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(brand): add authentic sketch frame from team footage"
            git push origin HEAD:main
          fi
