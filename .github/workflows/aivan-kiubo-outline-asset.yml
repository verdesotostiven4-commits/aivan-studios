name: Import KIUBO artwork supplied by the owner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aivan-kiubo-outline-asset.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aivan-kiubo-owner-artwork
  cancel-in-progress: false
jobs:
  install-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Copy the exact user-uploaded transparent KIUBO PNG
        env:
          USER_KIUBO_IMAGE_URL: "https://at.adobe.com/65n8eIJ1sXahlQP8"
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl --location --fail --retry 5 --retry-delay 2 --silent --show-error "$USER_KIUBO_IMAGE_URL" -o public/media/kiubo-user-upload.png
          echo 'a389ffc6c90800c10738e9a1cd452bb225da1c3f8175361316a73246089efbbb  public/media/kiubo-user-upload.png' | sha256sum --check
          file public/media/kiubo-user-upload.png
      - name: Replace KIUBO asset reference, without altering the picture
        run: |
          set -euo pipefail
          grep -F 'kiubo: "/media/kiubo-original-outlined.png",' components/BrandAsset.tsx
          sed -i 's|kiubo: "/media/kiubo-original-outlined.png",|kiubo: "/media/kiubo-user-upload.png",|' components/BrandAsset.tsx
          grep -F 'kiubo: "/media/kiubo-user-upload.png",' components/BrandAsset.tsx
      - name: Commit the exact PNG and website replacement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/kiubo-user-upload.png components/BrandAsset.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'assets(kiubo): replace footer logo with owner-provided transparent PNG'
            git push origin HEAD:main
          fi
