name: Import selected AIVAN team portraits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-selected-aivan-portraits.yml"

permissions:
  contents: write

concurrency:
  group: aivan-selected-portraits
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download the two approved portrait images intact
        env:
          ANDREA_URL: "https://at.adobe.com/SO7xbnr37WN4rozP"
          ALEXANDER_URL: "https://at.adobe.com/Hzv6zXT7MjUekFtd"
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl --fail --location --retry 3 --silent --show-error "$ANDREA_URL" --output public/media/andrea-portrait-selected.png
          curl --fail --location --retry 3 --silent --show-error "$ALEXANDER_URL" --output public/media/alexander-portrait-selected.png
          node <<'JS'
          const fs = require('fs');
          for (const name of ['andrea','alexander']) {
            const p = 'public/media/' + name + '-portrait-selected.png';
            const b = fs.readFileSync(p);
            if (b.toString('hex',0,8) !== '89504e470d0a1a0a') throw new Error('Not a PNG: '+p);
            if (b.readUInt32BE(16) !== 1122 || b.readUInt32BE(20) !== 1402) throw new Error('Wrong source image dimensions: '+p);
            if (b.length < 500000) throw new Error('Incomplete image: '+p);
            console.log('Verified user-selected portrait:', p, b.length, 'bytes');
          }
          JS
      - name: Commit originals for permanent website hosting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/*-portrait-selected.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(team): preserve two approved portrait files"
            git push origin HEAD:main
          fi
