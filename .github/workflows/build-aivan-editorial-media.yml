name: Build AIVAN authentic editorial images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-aivan-editorial-media.yml"
      - "tools/build_aivan_editorial_media.py"

permissions:
  contents: write

concurrency:
  group: aivan-authentic-editorial-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout original source material
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install reproducible image tools
        run: python -m pip install "Pillow==11.3.0" "gdown==5.2.0" "imageio-ffmpeg==0.6.0"
      - name: Derive faithful photos and video-frame visuals
        run: python tools/build_aivan_editorial_media.py
      - name: Commit optimized assets to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/hero-authentic-*.webp public/media/gallery-authentic-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(site): add faithful visual sequence from team media"
            git push origin HEAD:main
          else
            echo "Authentic editorial assets already current."
          fi
