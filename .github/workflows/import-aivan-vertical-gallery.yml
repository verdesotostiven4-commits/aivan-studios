name: Import approved vertical gallery visuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-aivan-vertical-gallery.yml"

permissions:
  contents: write

concurrency:
  group: aivan-vertical-gallery-image-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install image converter
        run: python -m pip install "Pillow==11.3.0"
      - name: Download exactly the six user-approved gallery images
        env:
          SRC_FOOD: "https://at.adobe.com/sj09GU2n0XQmPVga"
          SRC_SKETCH: "https://at.adobe.com/8HoXwSMOwbOlZzcZ"
          SRC_MASCOT: "https://at.adobe.com/q6HLjFD9rh1FVfec"
          SRC_BMDANCE: "https://at.adobe.com/dZMUR1FdbBzKzDwe"
          SRC_PRODUCTION: "https://at.adobe.com/fJV20NhXM20w81Fr"
          SRC_LEVID: "https://at.adobe.com/ureAqDeqJ6xj1Hr9"
        run: |
          set -euo pipefail
          mkdir -p /tmp/aivan-vertical public/media
          curl --fail --location --retry 3 --silent --show-error "$SRC_FOOD" --output /tmp/aivan-vertical/food.png
          curl --fail --location --retry 3 --silent --show-error "$SRC_SKETCH" --output /tmp/aivan-vertical/sketch.png
          curl --fail --location --retry 3 --silent --show-error "$SRC_MASCOT" --output /tmp/aivan-vertical/mascot.png
          curl --fail --location --retry 3 --silent --show-error "$SRC_BMDANCE" --output /tmp/aivan-vertical/bmdance.png
          curl --fail --location --retry 3 --silent --show-error "$SRC_PRODUCTION" --output /tmp/aivan-vertical/production.png
          curl --fail --location --retry 3 --silent --show-error "$SRC_LEVID" --output /tmp/aivan-vertical/levid.png
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          mapping=[
              ('food', 'gallery-food-vertical.webp'),
              ('sketch', 'gallery-idea-vertical.webp'),
              ('mascot', 'gallery-mascot-vertical.webp'),
              ('bmdance', 'gallery-bmdance-vertical.webp'),
              ('production', 'gallery-production-vertical.webp'),
              ('levid', 'gallery-levid-vertical.webp'),
          ]
          for stem, target in mapping:
              raw=Path('/tmp/aivan-vertical')/f'{stem}.png'
              if raw.read_bytes()[:8] != bytes.fromhex('89504e470d0a1a0a'):
                  raise RuntimeError(f'File is not PNG: {raw}')
              with Image.open(raw) as im:
                  im.load()
                  if im.size!=(1122,1402):
                      raise RuntimeError(f'Unexpected size in {stem}: {im.size}')
                  canvas=ImageOps.exif_transpose(im).convert('RGB')
                  canvas.save(Path('public/media')/target,'WEBP',quality=92,method=6)
              with Image.open(Path('public/media')/target) as check:
                  if check.size!=(1122,1402): raise RuntimeError('Bad output size: '+target)
                  check.verify()
              length=(Path('public/media')/target).stat().st_size
              if length<85000: raise RuntimeError('Suspiciously small output '+target)
              print('Verified',target,length,'bytes')
          PY
      - name: Commit approved images for permanent hosting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/gallery-*-vertical.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(gallery): install six approved 4-by-5 visuals"
            git push origin HEAD:main
          fi
