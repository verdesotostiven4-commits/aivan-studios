name: Install user-selected cinematic hero media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aivan-hero-nine-scene-import.yml'

permissions:
  contents: write

concurrency:
  group: aivan-nine-scene-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install image utilities
        run: python -m pip install 'Pillow==11.3.0'
      - name: Install FFmpeg (not preinstalled on this runner)
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
      - name: Download, optimize, and validate approved original media
        env:
          IMG01_URL: "https://at.adobe.com/v27LemzBl6y2F4BQ"
          IMG02_URL: "https://at.adobe.com/hddL2uojOG3dfzwK"
          IMG03_URL: "https://at.adobe.com/KVvRA0qFKsbkjgAX"
          IMG04_URL: "https://at.adobe.com/XMXiLECQ1WLgBShI"
          IMG05_URL: "https://at.adobe.com/SrgUVxuuZIIpi8dt"
          IMG06_URL: "https://at.adobe.com/fFZdpPjT5GMuYkRV"
          MOV07_URL: "https://at.adobe.com/RGWHdIel1g5uuaOy"
          MOV08_URL: "https://at.adobe.com/eYustMl3NGawBE0T"
          MOV09_URL: "https://at.adobe.com/Z9bUb8xXdbZYAOfQ"
        run: |
          set -euo pipefail
          mkdir -p /tmp/aivan-hero public/media
          curl --fail --location --retry 3 --silent --show-error "$IMG01_URL" --output /tmp/aivan-hero/source-01.png
          curl --fail --location --retry 3 --silent --show-error "$IMG02_URL" --output /tmp/aivan-hero/source-02.png
          curl --fail --location --retry 3 --silent --show-error "$IMG03_URL" --output /tmp/aivan-hero/source-03.png
          curl --fail --location --retry 3 --silent --show-error "$IMG04_URL" --output /tmp/aivan-hero/source-04.png
          curl --fail --location --retry 3 --silent --show-error "$IMG05_URL" --output /tmp/aivan-hero/source-05.png
          curl --fail --location --retry 3 --silent --show-error "$IMG06_URL" --output /tmp/aivan-hero/source-06.png
          curl --fail --location --retry 3 --silent --show-error "$MOV07_URL" --output /tmp/aivan-hero/source-07.mp4
          curl --fail --location --retry 3 --silent --show-error "$MOV08_URL" --output /tmp/aivan-hero/source-08.mp4
          curl --fail --location --retry 3 --silent --show-error "$MOV09_URL" --output /tmp/aivan-hero/source-09.mp4
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Path('/tmp/aivan-hero'); dst=Path('public/media')
          for i in range(1,7):
              p=src/f'source-{i:02d}.png'
              with Image.open(p) as im:
                  im.load()
                  if im.size != (1672,941): raise RuntimeError(f'Wrong image source {i}: {im.size}')
                  output=ImageOps.fit(ImageOps.exif_transpose(im).convert('RGB'),(1920,1080),method=Image.Resampling.LANCZOS)
                  target=dst/f'hero-scene-{i:02d}.webp'
                  output.save(target,'WEBP',quality=89,method=6)
              if target.stat().st_size < 55000: raise RuntimeError(f'Incomplete image: {target}')
              print(target, target.stat().st_size)
          PY
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss 1.3 -i /tmp/aivan-hero/source-07.mp4 -t 6.7 -an -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24" -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -movflags +faststart public/media/hero-scene-07.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss 2.3 -i /tmp/aivan-hero/source-07.mp4 -frames:v 1 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" -q:v 2 /tmp/aivan-hero/poster-07.jpg
          ffmpeg -nostdin -hide_banner -loglevel error -y -i /tmp/aivan-hero/poster-07.jpg -frames:v 1 -c:v libwebp -quality 84 public/media/hero-scene-07-poster.webp
          test "$(stat -c %s public/media/hero-scene-07.mp4)" -gt 140000
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 public/media/hero-scene-07.mp4 | grep -x '1280,720'
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss 8 -i /tmp/aivan-hero/source-08.mp4 -t 6.7 -an -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24" -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -movflags +faststart public/media/hero-scene-08.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss 9 -i /tmp/aivan-hero/source-08.mp4 -frames:v 1 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" -q:v 2 /tmp/aivan-hero/poster-08.jpg
          ffmpeg -nostdin -hide_banner -loglevel error -y -i /tmp/aivan-hero/poster-08.jpg -frames:v 1 -c:v libwebp -quality 84 public/media/hero-scene-08-poster.webp
          test "$(stat -c %s public/media/hero-scene-08.mp4)" -gt 140000
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 public/media/hero-scene-08.mp4 | grep -x '1280,720'
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss 14 -i /tmp/aivan-hero/source-09.mp4 -t 6.7 -an -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=24" -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -movflags +faststart public/media/hero-scene-09.mp4
          ffmpeg -nostdin -hide_banner -loglevel error -y -ss 15 -i /tmp/aivan-hero/source-09.mp4 -frames:v 1 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720" -q:v 2 /tmp/aivan-hero/poster-09.jpg
          ffmpeg -nostdin -hide_banner -loglevel error -y -i /tmp/aivan-hero/poster-09.jpg -frames:v 1 -c:v libwebp -quality 84 public/media/hero-scene-09-poster.webp
          test "$(stat -c %s public/media/hero-scene-09.mp4)" -gt 140000
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 public/media/hero-scene-09.mp4 | grep -x '1280,720'
      - name: Commit only approved image and video assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/hero-scene-{01,02,03,04,05,06}.webp public/media/hero-scene-{07,08,09}.mp4 public/media/hero-scene-{07,08,09}-poster.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets(hero): install six supplied images and three optimized video scenes'
            git push origin HEAD:main
          fi
